<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1220">
<title>Nova Scientific Calculator</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--surface:#141d31;--surface2:#1b2941;--key:#263650;--text:#f2f7ff;--muted:#9cacc4;--accent:#7b9cff;--accent2:#9e83fa;--line:#30425c;--shadow:0 24px 80px #02071380}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 20% 4%,#263767 0,transparent 42%),radial-gradient(ellipse at 95% 90%,#29204f 0,transparent 46%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}.shell{width:min(100%,980px)}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.logo{height:42px;width:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,var(--accent),var(--accent2));font-size:25px;font-weight:700;box-shadow:0 8px 22px #617bf43d}.eyebrow{font-size:11px;letter-spacing:.18em;font-weight:700;color:#a9b9ff}.top h1{font-size:20px;margin:3px 0 0;letter-spacing:-.04em}.hint{font-size:12px;color:var(--muted)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 255px;gap:16px}.calculator,.history{background:linear-gradient(160deg,#172238f5,#111b2ded);border:1px solid #34445f;box-shadow:var(--shadow);border-radius:24px}.calculator{padding:22px}.display{min-height:172px;background:#0b1425;border:1px solid #30415b;border-radius:18px;padding:18px 20px;display:flex;flex-direction:column;align-items:stretch;justify-content:space-between;position:relative;overflow:hidden}.display-top{display:flex;justify-content:space-between;align-items:center;gap:12px}.mode{border:1px solid #445e83;background:#202f49;color:#b9ccff;border-radius:9px;padding:7px 11px;font-weight:750;font-size:12px;cursor:pointer}.mode:focus-visible,button:focus-visible{outline:2px solid #c8d7ff;outline-offset:2px}.memory-indicator{font-size:11px;letter-spacing:.09em;color:var(--muted)}.expression{font-size:clamp(20px,3.7vw,31px);color:var(--text);text-align:right;overflow-wrap:anywhere;line-height:1.4;min-height:45px;margin-top:16px;font-variant-numeric:tabular-nums}.preview{color:#9eaecc;text-align:right;font-size:20px;min-height:30px;font-variant-numeric:tabular-nums}.preview.error{color:#ff9eaa;font-size:14px}.group-caption{display:flex;justify-content:space-between;margin:20px 2px 12px;color:var(--muted);font-size:11px;font-weight:750;letter-spacing:.1em}.keyboard{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}button{font:inherit;touch-action:manipulation}.key{border:1px solid #354966;border-radius:12px;min-height:56px;padding:7px 2px;background:var(--key);color:var(--text);font-weight:680;font-size:18px;cursor:pointer;transition:transform .11s,background .12s,border-color .12s;user-select:none}.key:hover{background:#344967;border-color:#53698e}.key:active{transform:scale(.94);background:#435a7c}.key.function{background:#1b2b45;color:#a6baff;font-size:15px}.key.operator{background:#2d3e61;color:#c8d6ff;font-size:21px}.key.utility{background:#37334f;color:#e1cfff;font-size:15px}.key.equal{background:linear-gradient(145deg,#7497ff,#947cf4);border-color:#a5b6ff;color:#0d1630;font-size:25px;font-weight:850}.key.equal:hover{background:linear-gradient(145deg,#8cabff,#a594ff)}.key.zero{grid-column:span 2}.history{padding:20px;display:flex;flex-direction:column;min-height:400px;max-height:745px}.history-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.history h2{font-size:16px;margin:0}.clear-history{background:transparent;color:#aabce0;border:1px solid #3a4b68;border-radius:9px;padding:8px 10px;font-size:12px;cursor:pointer}.history-items{flex:1;overflow-y:auto;min-height:0;margin-top:18px;display:flex;flex-direction:column;gap:9px}.history-empty{color:#8193ae;text-align:center;margin:auto;font-size:13px;line-height:1.8}.history-item{width:100%;border:1px solid #344762;background:#1a2940;border-radius:12px;color:inherit;padding:13px 12px;text-align:right;cursor:pointer;overflow-wrap:anywhere}.history-item:hover{background:#243755}.history-item .from{font-size:12px;color:#93a9c9;margin-bottom:6px}.history-item .to{font-size:19px;font-weight:760}.history-footer{padding-top:16px;border-top:1px solid #30415a;color:#90a4c4;font-size:12px;line-height:1.7}.history-footer kbd{background:#253651;padding:2px 5px;border-radius:4px;font-family:inherit}.footer{text-align:center;margin-top:17px;color:#7185a4;font-size:12px}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,14px);opacity:0;pointer-events:none;background:#dbe6ff;color:#142344;border-radius:10px;padding:10px 15px;font-size:13px;transition:opacity .2s,transform .2s;z-index:5}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:740px){body{display:block;padding:14px}.shell{margin:0 auto}.layout{grid-template-columns:1fr}.history{min-height:auto;max-height:265px}.history-items{max-height:165px}.calculator{padding:14px}.top{padding:4px 2px}.hint{display:none}.display{min-height:150px;padding:14px}.key{min-height:54px}.keyboard{gap:7px}}@media(max-width:390px){.key{min-height:48px;font-size:16px;border-radius:10px}.key.function{font-size:13px}.keyboard{gap:5px}.calculator{padding:10px}.top h1{font-size:17px}.display{min-height:140px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important}}
</style>
</head>
<body>
<main class="shell">
<header class="top"><div class="brand"><div class="logo" aria-hidden="true">∑</div><div><div class="eyebrow">PRECISION TOOLS</div><h1>Nova Scientific</h1></div></div><span class="hint">공학용 계산기 · 키보드 지원</span></header>
<div class="layout"><section class="calculator" aria-label="공학용 계산기"><div class="display" aria-live="polite"><div class="display-top"><button id="angleMode" class="mode" type="button" title="각도 단위 전환">DEG ▾</button><span class="memory-indicator" id="memoryIndicator">SCIENTIFIC MODE</span></div><div class="expression" id="expression" aria-label="입력 수식">0</div><div class="preview" id="preview" aria-label="계산 미리보기">0</div></div><div class="group-caption"><span>FUNCTIONS & NUMBERS</span><span>fx</span></div><div class="keyboard" id="keyboard">
<button class="key utility" data-action="clear">AC</button><button class="key utility" data-action="backspace" aria-label="한 글자 지우기">⌫</button><button class="key utility" data-insert="(" aria-label="여는 괄호">(</button><button class="key utility" data-insert=")" aria-label="닫는 괄호">)</button><button class="key operator" data-insert="÷">÷</button>
<button class="key function" data-insert="sin(">sin</button><button class="key function" data-insert="cos(">cos</button><button class="key function" data-insert="tan(">tan</button><button class="key function" data-insert="^">xʸ</button><button class="key operator" data-insert="×">×</button>
<button class="key function" data-insert="asin(">sin⁻¹</button><button class="key function" data-insert="acos(">cos⁻¹</button><button class="key function" data-insert="atan(">tan⁻¹</button><button class="key function" data-insert="√(">√x</button><button class="key operator" data-insert="−">−</button>
<button class="key function" data-insert="ln(">ln</button><button class="key function" data-insert="log(">log</button><button class="key function" data-insert="π">π</button><button class="key function" data-insert="ℯ">e</button><button class="key operator" data-insert="+">+</button>
<button class="key" data-insert="7">7</button><button class="key" data-insert="8">8</button><button class="key" data-insert="9">9</button><button class="key function" data-insert="!">x!</button><button class="key function" data-insert="%">%</button>
<button class="key" data-insert="4">4</button><button class="key" data-insert="5">5</button><button class="key" data-insert="6">6</button><button class="key function" data-insert="^2" aria-label="제곱">x²</button><button class="key function" data-action="reciprocal">1/x</button>
<button class="key" data-insert="1">1</button><button class="key" data-insert="2">2</button><button class="key" data-insert="3">3</button><button class="key function" data-insert="10^">10ˣ</button><button class="key function" data-insert="abs(">|x|</button>
<button class="key zero" data-insert="0">0</button><button class="key" data-insert=".">.</button><button class="key function" data-action="ans">Ans</button><button class="key equal" data-action="equals">=</button>
</div></section><aside class="history" aria-label="계산 기록"><div class="history-head"><h2>계산 기록</h2><button class="clear-history" id="clearHistory" type="button">기록 삭제</button></div><div id="historyItems" class="history-items"><div class="history-empty">계산 결과가 여기에 표시됩니다.<br>기록을 클릭하면 다시 사용할 수 있어요.</div></div><div class="history-footer">키보드: <kbd>Enter</kbd> 계산 · <kbd>Esc</kbd> 초기화<br><kbd>Backspace</kbd> 삭제 · <kbd>^</kbd> 거듭제곱</div></aside></div><div class="footer">정확한 계산을 위한 깔끔한 도구 · 브라우저에서 바로 사용</div></main><div class="toast" id="toast" role="status"></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), exprEl=$('expression'), previewEl=$('preview'), histEl=$('historyItems'), modeEl=$('angleMode'), toastEl=$('toast');
let expression='',angle='DEG',ans=0,history=[],justEvaluated=false,toastTimer;
const functions=new Set(['sin','cos','tan','asin','acos','atan','ln','log','sqrt','abs']);
function tokenize(s){const out=[];let i=0;while(i<s.length){const tail=s.slice(i);if(/\s/.test(s[i])){i++;continue}const num=tail.match(/^(?:\d+\.?\d*|\.\d+)(?:[eE][+\-]?\d+)?/);if(num){out.push({type:'num',value:Number(num[0])});i+=num[0].length;continue}const name=tail.match(/^[a-zA-Z]+/);if(name){const n=name[0].toLowerCase();if(n==='pi')out.push({type:'num',value:Math.PI});else if(n==='e')out.push({type:'num',value:Math.E});else if(n==='ans')out.push({type:'num',value:ans});else if(functions.has(n))out.push({type:'fn',value:n});else throw Error('알 수 없는 함수입니다');i+=name[0].length;continue}const c=s[i];if(c==='π'||c==='ℯ'){out.push({type:'num',value:c==='π'?Math.PI:Math.E});i++;continue}if(c==='√'){out.push({type:'fn',value:'sqrt'});i++;continue}if('()+−-×*/÷^!%'.includes(c)){out.push({type:'op',value:c==='−'?'-':c==='×'?'*':c==='÷'?'/':c});i++;continue}throw Error('지원하지 않는 문자입니다')}const result=[];for(const t of out){const prev=result[result.length-1];if(prev&&(prev.type==='num'||(prev.type==='op'&&[')', '!', '%'].includes(prev.value)))&&(t.type==='num'||t.type==='fn'||(t.type==='op'&&t.value==='(')))result.push({type:'op',value:'*'});result.push(t)}return result}
function factorial(n){if(!Number.isInteger(n)||n<0||n>170)throw Error('팩토리얼은 0~170의 정수만 지원합니다');let r=1;for(let i=2;i<=n;i++)r*=i;return r}
function evaluate(s){const tokens=tokenize(s);if(!tokens.length)throw Error('수식을 입력하세요');let pos=0;const current=()=>tokens[pos];const match=v=>{if(current()?.value===v){pos++;return true}return false};function applyFn(fn,x){const rad=x*Math.PI/180,deg=180/Math.PI;switch(fn){case 'sin':return Math.sin(angle==='DEG'?rad:x);case 'cos':return Math.cos(angle==='DEG'?rad:x);case 'tan':{const a=angle==='DEG'?rad:x;if(Math.abs(Math.cos(a))<1e-12)throw Error('이 각도에서 tan 값은 정의되지 않습니다');return Math.tan(a)}case 'asin':if(Math.abs(x)>1)throw Error('asin 입력은 -1~1이어야 합니다');return Math.asin(x)*(angle==='DEG'?deg:1);case 'acos':if(Math.abs(x)>1)throw Error('acos 입력은 -1~1이어야 합니다');return Math.acos(x)*(angle==='DEG'?deg:1);case 'atan':return Math.atan(x)*(angle==='DEG'?deg:1);case 'ln':if(x<=0)throw Error('ln은 양수만 계산할 수 있습니다');return Math.log(x);case 'log':if(x<=0)throw Error('log는 양수만 계산할 수 있습니다');return Math.log10(x);case 'sqrt':if(x<0)throw Error('음수의 제곱근은 지원하지 않습니다');return Math.sqrt(x);case 'abs':return Math.abs(x)}}
function primary(){if(match('+'))return primary();if(match('-'))return -power();const t=current();if(!t)throw Error('수식이 완성되지 않았습니다');if(match('(')){const v=add();if(!match(')'))throw Error('닫는 괄호가 필요합니다');return v}if(t.type==='fn'){pos++;if(!match('('))throw Error('함수 뒤에 괄호가 필요합니다');const v=add();if(!match(')'))throw Error('닫는 괄호가 필요합니다');return applyFn(t.value,v)}if(t.type==='num'){pos++;return t.value}throw Error('잘못된 수식입니다')}
function postfix(){let v=primary();while(true){if(match('!'))v=factorial(v);else if(match('%'))v/=100;else break}return v}
function power(){let v=postfix();if(match('^'))v=Math.pow(v,power());return v}
function multiply(){let v=power();while(true){if(match('*'))v*=power();else if(match('/')){const d=power();if(d===0)throw Error('0으로 나눌 수 없습니다');v/=d}else break}return v}
function add(){let v=multiply();while(true){if(match('+'))v+=multiply();else if(match('-'))v-=multiply();else break}return v}
const value=add();if(pos!==tokens.length)throw Error('수식을 확인하세요');if(!Number.isFinite(value))throw Error('계산 범위를 초과했습니다');return Object.is(value,-0)?0:value}
function fmt(n){if(!Number.isFinite(n))return '오류';if(n===0)return '0';const abs=Math.abs(n);if(abs>=1e13||abs<1e-7)return n.toExponential(8).replace(/\.?0+e/,'e');return Number(n.toPrecision(12)).toString()}
function render(){exprEl.textContent=expression||'0';previewEl.classList.remove('error');if(!expression){previewEl.textContent='0';return}try{previewEl.textContent='= '+fmt(evaluate(expression))}catch(e){previewEl.textContent='…'}}
function notify(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),1800)}
function insert(str){if(justEvaluated){if(/^[0-9.(πℯ]|^(?:sin|cos|tan|asin|acos|atan|ln|log|√|abs)/.test(str))expression='';justEvaluated=false}if(expression.length>220){notify('수식이 너무 깁니다');return}if(str==='10^')str='10^';expression+=str;render()}
function erase(){justEvaluated=false;if(!expression)return;const endings=['asin(','acos(','atan(','sin(','cos(','tan(','log(','ln(','abs(','√(','Ans'];const ending=endings.find(x=>expression.endsWith(x));expression=expression.slice(0,-(ending?.length||1));render()}
function calculate(){if(!expression)return;try{const source=expression;const result=evaluate(expression);ans=result;expression=fmt(result);justEvaluated=true;history.unshift({source,result:fmt(result),angle});history=history.slice(0,40);renderHistory();render()}catch(err){previewEl.classList.add('error');previewEl.textContent=err.message||'계산 오류';notify('수식을 확인해 주세요')}}
function renderHistory(){histEl.replaceChildren();if(!history.length){const empty=document.createElement('div');empty.className='history-empty';empty.innerHTML='계산 결과가 여기에 표시됩니다.<br>기록을 클릭하면 다시 사용할 수 있어요.';histEl.append(empty);return}for(const entry of history){const b=document.createElement('button');b.type='button';b.className='history-item';const from=document.createElement('div'),to=document.createElement('div');from.className='from';to.className='to';from.textContent=entry.source+' · '+entry.angle;to.textContent='= '+entry.result;b.append(from,to);b.addEventListener('click',()=>{expression=entry.result;justEvaluated=true;render();notify('결과를 불러왔습니다')});histEl.append(b)}}
function action(key){if(key==='clear'){expression='';justEvaluated=false;render()}else if(key==='backspace')erase();else if(key==='equals')calculate();else if(key==='ans')insert('Ans');else if(key==='reciprocal'){expression=expression?'1/('+expression+')':'1/(';justEvaluated=false;render()}}
$('keyboard').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.insert)insert(b.dataset.insert);else if(b.dataset.action)action(b.dataset.action)});
modeEl.addEventListener('click',()=>{angle=angle==='DEG'?'RAD':'DEG';modeEl.textContent=angle+' ▾';render();notify(angle==='DEG'?'각도 모드: 도(DEG)':'각도 모드: 라디안(RAD)')});$('clearHistory').addEventListener('click',()=>{history=[];renderHistory();notify('계산 기록을 삭제했습니다')});
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey||['INPUT','TEXTAREA'].includes(document.activeElement?.tagName))return;const k=e.key;if(/^[0-9.]$/.test(k)){insert(k);e.preventDefault()}else if(k==='*'){insert('×');e.preventDefault()}else if(k==='/'){insert('÷');e.preventDefault()}else if(k==='-'){insert('−');e.preventDefault()}else if('()+^%!'.includes(k)){insert(k);e.preventDefault()}else if(k==='Enter'||k==='='){calculate();e.preventDefault()}else if(k==='Backspace'){erase();e.preventDefault()}else if(k==='Escape'||k==='Delete'){action('clear');e.preventDefault()}else if(k.toLowerCase()==='p'){insert('π');e.preventDefault()}});
render();
})();
</script>
</body>
</html>
